<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArtCraft ruler scrollbar — isolated demo</title>
<style>
/* Dimensions, palette, tick geometry and digit styling derived from the supplied ArtCraft page/CSS. */
:root{--bg:#f2f1ee;--ink:#101014;--accent:#2d81ff;--accent-ink:#1659c4}
*{box-sizing:border-box}html{scrollbar-width:none;background:var(--bg)}html::-webkit-scrollbar{display:none}body{margin:0;background:var(--bg);color:var(--ink)}main{height:6007px;position:relative}
#ruler{position:fixed;right:0;top:0;bottom:0;width:60px;z-index:40;overflow:hidden;cursor:crosshair;touch-action:none;user-select:none}
#glass{position:absolute;inset:0;pointer-events:none;backdrop-filter:blur(9px);background:color-mix(in srgb,var(--bg) 55%,transparent);mask-image:linear-gradient(to left,black 40%,rgba(0,0,0,.745) 47.5%,rgba(0,0,0,.53) 55%,rgba(0,0,0,.356) 62.5%,rgba(0,0,0,.22) 70%,rgba(0,0,0,.116) 77.5%,rgba(0,0,0,.047) 85%,rgba(0,0,0,.01) 92.5%,transparent 100%)}
#tickRail{position:absolute;left:0;right:0;top:0;pointer-events:none;will-change:transform}
.tick{position:absolute;left:0;right:0;height:0}.tick-line{position:absolute;right:0;top:0;height:1px;background:var(--ink);transform-origin:right center}.tick-label{position:absolute;right:24px;top:0;transform:translateY(-50%);font:9px/1 monospace;letter-spacing:.08em;color:var(--ink);opacity:.5}
#zoomBand{position:absolute;left:0;right:0;top:0;background:color-mix(in srgb,var(--ink) 10%,transparent);border-top:1px solid color-mix(in srgb,var(--ink) 50%,transparent);border-bottom:1px solid color-mix(in srgb,var(--ink) 50%,transparent);opacity:0;pointer-events:none}
#needle{position:absolute;left:0;right:0;top:0;height:0;opacity:0;pointer-events:none;will-change:transform}
#needleLine{position:absolute;left:0;right:0;top:0;height:1px;background:var(--accent);box-shadow:0 0 6px var(--accent)}
#percent{position:absolute;right:2px;top:4px;color:var(--accent-ink);font:9px/1 monospace;letter-spacing:.08em;white-space:nowrap}.ruler-digits{height:1em;line-height:1;display:inline-flex;overflow:hidden}.ruler-digit-col{display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.2,.9,.2,1)}.ruler-digit-col>span{height:1em;display:block}
</style></head><body><main id="main"></main><div id="ruler" role="scrollbar" aria-controls="main" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Page position"><div id="glass" aria-hidden="true"></div><div id="tickRail" aria-hidden="true"></div><div id="zoomBand" aria-hidden="true"></div><div id="needle" aria-hidden="true"><div id="needleLine"></div><div id="percent"><span class="ruler-digits" id="digits"></span><span style="margin-left:2px">%</span></div></div></div>
<script>
/* Standalone reimplementation of the interaction/mapping visible in ArtCraft's
   captured production bundle (29wilaqtb26u5.js). No React/Next.js dependencies. */
(()=>{'use strict';
const ruler=document.getElementById('ruler'),rail=document.getElementById('tickRail'),needle=document.getElementById('needle'),band=document.getElementById('zoomBand'),digits=document.getElementById('digits');
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const cols=[];let zoom=0,zoomTarget=0,drag=false,dirty=true;
for(let i=0;i<=100;i++){const t=document.createElement('div');t.className='tick';const line=document.createElement('span');line.className='tick-line';line.style.width=(i%5===0?20:10)+'px';line.style.opacity=i%5===0?'.8':'.4';t.append(line);if(i%5===0){const l=document.createElement('span');l.className='tick-label';l.textContent=i;t.append(l)}rail.append(t)}
for(let k=0;k<3;k++){const col=document.createElement('span');col.className='ruler-digit-col';for(let n=0;n<=9;n++){const sp=document.createElement('span');sp.textContent=n;col.append(sp)}digits.append(col);cols.push(col)}
const ticks=[...rail.children];let lastDigits=[-1,-1,-1];
function dims(){const vh=innerHeight,docH=document.documentElement.scrollHeight,max=Math.max(1,docH-vh),pos=clamp(scrollY,0,max),ratio=pos/max,edgePad=12,base=48+edgePad,span=Math.max(1,vh-48-2*edgePad),drift=base-ratio*(48+2*edgePad);return{vh,docH,max,pos,ratio,base,span,drift}}
function scrollAt(y){const d=dims();scrollTo({top:clamp((y-d.base)/d.span,0,1)*d.max,behavior:'instant'})}
function render(){const d=dims();const moved=-d.pos+d.drift;rail.style.transform=`translate3d(0,${moved}px,0)`;const tickHeight=d.docH/100;for(let i=0;i<ticks.length;i++)ticks[i].style.top=(tickHeight*i)+'px';
const pct=d.ratio*100,markY=d.base+d.ratio*d.span;needle.style.transform=`translate3d(0,${markY}px,0)`;needle.style.opacity=String(zoom);band.style.transform=`translate3d(0,${d.base+d.pos/d.docH*d.span}px,0)`;band.style.height=(d.vh/d.docH*d.span)+'px';band.style.opacity=String(zoom*.9);
const v=String(Math.round(pct)).padStart(3,'0');for(let j=0;j<3;j++){const n=+v[j];if(n!==lastDigits[j]){cols[j].style.transform=`translateY(-${n}em)`;lastDigits[j]=n}}
if(zoom!==zoomTarget){zoom+=(zoomTarget-zoom)*.18;if(Math.abs(zoom-zoomTarget)<.002)zoom=zoomTarget}requestAnimationFrame(render)}
function pointerY(e){return e.clientY-ruler.getBoundingClientRect().top}
ruler.addEventListener('pointerenter',()=>{zoomTarget=1});ruler.addEventListener('pointerleave',()=>{if(!drag)zoomTarget=0});
ruler.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag=true;zoomTarget=1;ruler.setPointerCapture(e.pointerId);scrollAt(pointerY(e));e.preventDefault()});ruler.addEventListener('pointermove',e=>{if(drag)scrollAt(pointerY(e))});
ruler.addEventListener('pointerup',e=>{drag=false;if(ruler.hasPointerCapture(e.pointerId))ruler.releasePointerCapture(e.pointerId);zoomTarget=ruler.matches(':hover')?1:0});ruler.addEventListener('pointercancel',()=>{drag=false;zoomTarget=0});
ruler.addEventListener('keydown',e=>{let amount=0;if(e.key==='ArrowDown')amount=60;else if(e.key==='ArrowUp')amount=-60;else if(e.key==='PageDown')amount=innerHeight;else if(e.key==='PageUp')amount=-innerHeight;else if(e.key==='Home'){scrollTo(0,0);e.preventDefault();return}else if(e.key==='End'){scrollTo(0,document.documentElement.scrollHeight);e.preventDefault();return}else return;scrollBy(0,amount);e.preventDefault()});ruler.tabIndex=0;
requestAnimationFrame(render);
})();
</script></body></html>
